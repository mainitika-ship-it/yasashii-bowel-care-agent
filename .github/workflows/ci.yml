name: Yasashii standalone verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test without network or AWS calls
        run: python -m pytest -q
      - name: Exercise synthetic pipeline
        run: python src/demo.py --mode offline
      - name: Verify standalone packaging
        run: python tools/export_submission.py
